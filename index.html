<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17142B">
<title>إطلالتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17142B;--panel:#221E3D;--panel2:#2C2750;--ink:#F3F0FF;--mute:#A39CC8;--line:#3A3463;--pink:#FF5C8A;--good:#5BE3B0;--warn:#FFB547;--bad:#FF5C6C;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "Readex Pro",system-ui,sans-serif;min-height:100dvh;padding-bottom:96px}
main{max-width:480px;margin:0 auto;padding:20px 18px}
[hidden]{display:none!important}
h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:8px 0 4px}
h2{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:18px}
button,label{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--pink);outline-offset:3px}
.frame{position:relative;overflow:hidden;width:100%;aspect-ratio:3/4;max-height:62vh;border:2px dashed var(--line);border-radius:28px;background:var(--panel) center/cover no-repeat;display:grid;place-items:center;text-align:center;padding:24px;transition:border-color .2s}
.frame:hover{border-color:var(--pink)}
.frame svg{width:46px;height:46px;stroke:var(--pink);fill:none;stroke-width:1.6;margin-bottom:10px}
.frame p{font-weight:600;font-size:18px}
.frame small{display:block;color:var(--mute);font-size:13px;font-weight:300}
.frame.has{border-style:solid;border-color:transparent}
.frame.scan::after{content:"";position:absolute;inset:0 0 auto 0;height:28%;background:linear-gradient(transparent,rgba(255,92,138,.6),transparent);animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(360%)}}
.card{background:var(--panel);border-radius:24px;padding:22px;margin-top:16px}
.ringBox{position:relative;width:150px;height:150px;margin:0 auto 10px}
.ringBox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringBox circle{fill:none;stroke-width:9;stroke-linecap:round}
#ringBg{stroke:var(--panel2)}
#ringFg{stroke-dasharray:326.7;stroke-dashoffset:326.7}
#num{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700}
#cmt{text-align:center;font-size:17px}
#sug{margin-top:14px;padding:12px 14px;background:var(--panel2);border-radius:14px;border-inline-start:4px solid var(--warn);font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;background:var(--pink);color:#17142B;font-weight:700;font-size:17px;margin-top:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.it{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--panel)}
.it img{width:100%;height:100%;object-fit:cover;display:block}
.it span{position:absolute;inset:auto 0 0 0;padding:14px 6px 5px;text-align:center;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.it button{position:absolute;top:5px;inset-inline-start:5px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.6);font-size:16px;line-height:1}
.add{display:grid;place-content:center;text-align:center;border:2px dashed var(--line);background:none}
.add b{font-size:30px;color:var(--pink);font-weight:300;line-height:1}
.add span{position:static;background:none;padding:0;font-size:12px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.chips button{background:var(--panel);border:2px solid transparent;border-radius:18px;padding:14px 4px;font-weight:600;font-size:15px}
.chips i{display:block;font-style:normal;font-size:28px;margin-bottom:2px}
.chips button.on{border-color:var(--pink);background:var(--panel2)}
.pieces{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}
.pieces figure{width:calc(50% - 6px);text-align:center}
.pieces img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;display:block}
.pieces figcaption{font-size:13px;color:var(--mute);margin-top:4px}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:rgba(23,20,43,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--mute);font-size:12px;display:grid;justify-items:center;gap:2px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pink)}
#toast,#busy{position:fixed;inset-inline:18px;bottom:96px;max-width:444px;margin:auto;padding:13px 16px;border-radius:16px;text-align:center;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast{background:#3A1F33;border:1px solid var(--bad)}
#busy{background:var(--panel2);border:1px solid var(--pink)}
#toast.on,#busy.on{opacity:1}
@media (prefers-reduced-motion:reduce){.frame.scan::after{animation:none}*{transition:none!important}}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
</head>
<body>
<main>
<section class="view" id="v-rate">
  <h1>إطلالتي</h1>
  <p class="sub">صوّر لبسك وشوف تقييمه في ثواني.</p>
  <label class="frame" id="frame">
    <input type="file" id="pickRate" accept="image/*" hidden>
    <div id="frameHint">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <p>صوّر إطلالتك</p>
      <small>أو اختار صورة من المعرض</small>
    </div>
  </label>
  <div class="card" id="res" hidden>
    <div class="ringBox">
      <svg viewBox="0 0 120 120"><circle id="ringBg" cx="60" cy="60" r="52"/><circle id="ringFg" cx="60" cy="60" r="52"/></svg>
      <div id="num">0</div>
    </div>
    <p id="cmt"></p>
    <p id="sug" hidden></p>
  </div>
</section>

<section class="view" id="v-wd" hidden>
  <h2>دولابي</h2>
  <p class="sub" id="wdCount"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="wdEmpty">ضيف أول قطعة من لبسك، وإحنا نحللها.</p>
</section>

<section class="view" id="v-fit" hidden>
  <h2>هتروح فين؟</h2>
  <p class="sub">اختار المناسبة وهنجمع لك طقم من دولابك.</p>
  <div id="fitEmpty" class="card" hidden>
    <p class="empty" style="padding:6px">محتاج قطعتين على الأقل في دولابك عشان نجمع طقم.</p>
    <button class="btn" id="toWd">ضيف قطع</button>
  </div>
  <div id="fitBody">
    <div class="chips" id="chips"></div>
    <button class="btn" id="go" disabled>اختار لي طقم</button>
    <div class="card" id="out" hidden>
      <div class="pieces" id="pieces"></div>
      <p id="fitCmt" style="text-align:center"></p>
    </div>
  </div>
</section>
</main>

<div id="toast" role="alert"></div>
<div id="busy" role="status"></div>

<nav>
  <button data-v="rate" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>التقييم</button>
  <button data-v="wd"><svg viewBox="0 0 24 24"><path d="M12 7a2 2 0 1 0-2-2M12 7v2l9 6a1.5 1.5 0 0 1-.9 2.7H3.9A1.5 1.5 0 0 1 3 15l9-6"/></svg>دولابي</button>
  <button data-v="fit"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>طقم</button>
</nav>

<script>
const $ = id => document.getElementById(id);
const KEY = 'etlalaty-wardrobe';
let wd = [];
try { wd = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(wd)); } catch (e) { toast('المساحة امتلت. احذف قطع قديمة.'); } }
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3800); }
function busy(on, t) { const e = $('busy'); e.textContent = t || ''; e.classList.toggle('on', on); }

function show(v) {
  document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== 'v-' + v);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'wd') drawWd();
  if (v === 'fit') drawFit();
  scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));
$('toWd').onclick = () => show('wd');

function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res({ blob: b, url: c.toDataURL('image/jpeg', q) }) : rej(), 'image/jpeg', q);
    };
    img.onerror = rej;
    img.src = u;
  });
}

async function post(path, fd) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 90000);
  try {
    const r = await fetch(path, { method: 'POST', body: fd, signal: ac.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  } finally { clearTimeout(t); }
}
function why(e) {
  const m = String(e.message);
  if (/503|UNAVAILABLE|429/.test(m)) return 'الموديل مشغول دلوقتي. جرّب تاني بعد ثواني.';
  if (e.name === 'AbortError') return 'الرد اتأخر. جرّب تاني.';
  return 'مقدرناش نوصل للسيرفر. اتأكد من النت وجرّب تاني.';
}

/* التقييم */
$('pickRate').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let s;
  try { s = await shrink(f, 1024, .85); } catch (x) { return toast('الصورة دي مش مدعومة. جرّب صورة تانية.'); }
  const fr = $('frame');
  fr.style.backgroundImage = 'url("' + s.url + '")';
  fr.classList.add('has', 'scan');
  $('frameHint').hidden = true; $('res').hidden = true;
  const fd = new FormData(); fd.append('image', s.blob, 'look.jpg');
  try { showScore(await post('/rate', fd)); } catch (x) { toast(why(x)); }
  fr.classList.remove('scan');
};

function showScore(j) {
  const sc = Math.max(0, Math.min(10, Number(j.score) || 0));
  const col = sc < 5 ? 'var(--bad)' : sc < 7 ? 'var(--warn)' : 'var(--good)';
  const ring = $('ringFg'), C = 326.7, t0 = performance.now();
  const D = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 1400;
  ring.style.stroke = col; $('num').style.color = col; $('res').hidden = false;
  (function step(n) {
    const p = Math.max(0, Math.min(1, (n - t0) / D)), v = sc * (1 - Math.pow(1 - p, 3));
    ring.style.strokeDashoffset = C * (1 - v / 10);
    $('num').textContent = (Math.round(v * 10) / 10).toFixed(1).replace('.0', '');
    if (p < 1) requestAnimationFrame(step);
  })(t0);
  $('cmt').textContent = j.comment || '';
  const sg = $('sug'); sg.textContent = j.suggestion || ''; sg.hidden = !(sc < 7 && j.suggestion);
  $('res').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* الدولاب */
function drawWd() {
  const g = $('grid'); g.innerHTML = '';
  wd.forEach((it, i) => {
    const d = document.createElement('div'); d.className = 'it';
    d.innerHTML = '<img alt=""><span></span><button aria-label="احذف القطعة">×</button>';
    d.querySelector('img').src = it.thumb;
    d.querySelector('span').textContent = it.type || 'قطعة';
    d.querySelector('button').onclick = () => { wd.splice(i, 1); save(); drawWd(); };
    g.appendChild(d);
  });
  const a = document.createElement('label'); a.className = 'it add';
  a.innerHTML = '<input type="file" accept="image/*" hidden><b>+</b><span>ضيف قطعة</span>';
  a.querySelector('input').onchange = addItem;
  g.appendChild(a);
  $('wdCount').textContent = wd.length ? wd.length + ' قطعة' : '';
  $('wdEmpty').hidden = wd.length > 0;
}
async function addItem(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  busy(true, 'بنحلل القطعة…');
  try {
    const up = await shrink(f, 900, .85), th = await shrink(f, 240, .7);
    const fd = new FormData(); fd.append('image', up.blob, 'item.jpg');
    const j = await post('/add-item', fd);
    wd.push({ id: j.id, type: j.type, color: j.color, style: j.style, thumb: th.url });
    save(); drawWd();
  } catch (x) { toast(why(x)); }
  busy(false);
}

/* الطقم */
let occ = '';
const OCC = [['💍', 'فرح'], ['💼', 'شغل'], ['🎓', 'دراسة'], ['🌙', 'خروجة'], ['🏃', 'رياضة'], ['🤝', 'مقابلة']];
function drawFit() {
  const c = $('chips');
  if (!c.children.length) OCC.forEach(o => {
    const b = document.createElement('button');
    b.innerHTML = '<i>' + o[0] + '</i>' + o[1];
    b.onclick = () => { occ = o[1]; [...c.children].forEach(x => x.classList.toggle('on', x === b)); $('go').disabled = false; };
    c.appendChild(b);
  });
  const few = wd.length < 2;
  $('fitEmpty').hidden = !few; $('fitBody').hidden = few; $('out').hidden = true;
}
$('go').onclick = async () => {
  if (!occ) return;
  busy(true, 'بنختار الطقم…');
  const fd = new FormData();
  fd.append('occasion', occ);
  fd.append('items', JSON.stringify(wd.map(({ id, type, color, style }) => ({ id, type, color, style }))));
  try {
    const j = await post('/outfit', fd);
    const row = $('pieces'); row.innerHTML = '';
    (j.ids || []).map(id => wd.find(x => x.id === id)).filter(Boolean).forEach(it => {
      const d = document.createElement('figure');
      d.innerHTML = '<img alt=""><figcaption></figcaption>';
      d.querySelector('img').src = it.thumb;
      d.querySelector('figcaption').textContent = it.type;
      row.appendChild(d);
    });
    if (!row.children.length) throw new Error('empty');
    $('fitCmt').textContent = j.comment || '';
    $('out').hidden = false;
    $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (x) { toast(x.message === 'empty' ? 'مقدرناش نجمع طقم. جرّب مناسبة تانية.' : why(x)); }
  busy(false);
};
</script>
<script src="i18n.js"></script>
<script src="welcome.js"></script>
<script src="credit.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>
